name: 🏗️ Build RTL8189FS Drivers

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel versi yang ingin di-build (contoh: 6.12.107)'
        required: false
        default: 'all'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Define kernel versions
        id: kernels
        run: |
          KERNELS="6.1.188 6.6.157 6.12.107"
          if [[ "${{ github.event.inputs.kernel_version }}" != "" && "${{ github.event.inputs.kernel_version }}" != "all" ]]; then
            KERNELS="${{ github.event.inputs.kernel_version }}"
          fi
          echo "kernel_list=${KERNELS}" >> $GITHUB_OUTPUT
          echo "Target kernels: $KERNELS"

      - name: Build drivers in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/work -w /work ubuntu:25.04 bash -c '
            apt-get update
            apt-get install -y build-essential bc wget curl git
            
            mkdir -p output
            for KVER in ${{ steps.kernels.outputs.kernel_list }}; do
              echo "============================================"
              echo "Building for kernel $KVER..."
              echo "============================================"
              
              cd /tmp
              wget -q "https://github.com/ophub/kernel/releases/download/kernel_stable/deb-$KVER.tar.gz" -O "deb-$KVER.tar.gz"
              tar -xzf "deb-$KVER.tar.gz"
              HEADER_DEB=$(find . -name "linux-headers_*.deb" | head -n 1)
              echo "Found header deb: $HEADER_DEB"
              dpkg -x "$HEADER_DEB" /tmp/extracted
              KSRC=$(find /tmp/extracted/usr/src -maxdepth 1 -type d -name "linux-headers-*" | head -n 1)
              echo "Kernel source: $KSRC"
              
              cd /work
              make clean || true
              make -j4 ARCH=arm64 KSRC="$KSRC" modules || echo "WARNING: Build gagal untuk $KVER"
              if [ -f 8189fs.ko ]; then
                cp 8189fs.ko "output/8189fs-$KVER.ko"
                echo "✅ Build selesai untuk $KVER"
              else
                echo "❌ 8189fs.ko tidak ditemukan untuk $KVER"
              fi
              rm -rf /tmp/*
            done
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-drivers
          path: output/*.ko
          retention-days: 90
